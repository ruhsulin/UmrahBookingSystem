name: Build

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UmrahBookingSystem/UmrahBookingSystem.slnx

      - name: Build
        run: dotnet build UmrahBookingSystem/UmrahBookingSystem.slnx --no-restore